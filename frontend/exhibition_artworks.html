<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ART GALLERY - Exhibition Artworks</title>
    <link rel="stylesheet" href="/styles.css"/>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">
          <div class="logo"></div>
          <div>
            <h1>Exhibition Artworks</h1>
            <p>Curated works in this exhibition</p>
          </div>
        </div>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/exhibitions.html">Exhibitions</a>
          <a href="/reports.html">Reports</a>
        </nav>
      </header>

      <h2 class="section-title">Artworks</h2>
      <div id="artworksGrid" class="grid cols-4"></div>
    </div>

    <script src="/app.js"></script>
    <script>
      async function load(){
        const id = getQueryParam("id");
        if (!id) return;
        const items = await apiFetch(`/exhibitions/${encodeURIComponent(id)}/artworks`);
        const grid = document.getElementById("artworksGrid");
        grid.innerHTML = "";
        for (const a of items){
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <h3>${a.title}</h3>
            <p><span class="muted">Medium:</span> ${a.medium}</p>
            <p><span class="muted">Price:</span> ${formatMoney(a.price)}</p>
            <a class="btn" href="/artwork.html?id=${a.artwork_id}" style="display:inline-block; margin-top:10px;">Details</a>
          `;
          grid.appendChild(card);
        }
      }
      load().catch(console.error);
    </script>
  </body>
</html>
